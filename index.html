<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Shin | 脚本展示</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080b;--panel:#0e1117;--line:#1c2230;--text:#e8ecf4;--mute:#8791a5;--acc:#3dffb0;--acc2:#18b6ff;--code:#0a0d13;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f7fa;--panel:#fff;--line:#dde3ec;--text:#10151f;--mute:#5a667b;--acc:#00a56a;--acc2:#0a7fc4;--code:#f0f3f8}}
:root[data-theme="light"]{--bg:#f5f7fa;--panel:#fff;--line:#dde3ec;--text:#10151f;--mute:#5a667b;--acc:#00a56a;--acc2:#0a7fc4;--code:#f0f3f8}
:root[data-theme="dark"]{--bg:#07080b;--panel:#0e1117;--line:#1c2230;--text:#e8ecf4;--mute:#8791a5;--acc:#3dffb0;--acc2:#18b6ff;--code:#0a0d13}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;
background-image:radial-gradient(60rem 30rem at 80% -10%,color-mix(in srgb,var(--acc) 14%,transparent),transparent),radial-gradient(40rem 25rem at -10% 20%,color-mix(in srgb,var(--acc2) 12%,transparent),transparent)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{font-weight:900;letter-spacing:.12em;font-size:1.15rem}
.logo i{color:var(--acc);font-style:normal}
.tools{display:flex;gap:8px}
.tools button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:500 .85rem inherit;font-family:inherit;cursor:pointer}
.tools button:hover{border-color:var(--acc)}
.hero{padding:70px 0 50px}
.tag{font-family:"JetBrains Mono",monospace;color:var(--acc);font-size:.8rem;letter-spacing:.15em}
h1{font-size:clamp(2.2rem,7vw,4.2rem);line-height:1.1;margin:.4em 0;font-weight:900}
h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);max-width:560px;font-size:1.05rem}
.cta{display:inline-block;margin-top:24px;padding:12px 26px;border-radius:10px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#04110c;font-weight:700;text-decoration:none}
h2{font-size:1.6rem;margin:0 0 6px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:20px 0 70px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:8px 8px 0}
.tab{background:none;border:0;color:var(--mute);padding:10px 16px;font:600 .85rem "JetBrains Mono",monospace;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--acc);border-color:var(--acc)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap}
.meta p{margin:0;color:var(--mute);font-size:.92rem}
.copy{background:var(--acc);color:#04110c;border:0;border-radius:8px;padding:8px 18px;font-weight:700;font-family:inherit;cursor:pointer}
.copy.ok{background:var(--acc2)}
.code{margin:0;background:var(--code);padding:18px;overflow-x:auto;max-height:480px;font:400 .85rem/1.7 "JetBrains Mono",ui-monospace,Consolas,monospace;border-top:1px solid var(--line);white-space:pre;tab-size:2}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:20px 0 70px}
.feat div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.feat b{color:var(--acc);font-family:"JetBrains Mono",monospace}
.feat h3{margin:.4em 0 .2em;font-size:1.05rem}
.feat p{margin:0;color:var(--mute);font-size:.92rem}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mute);font-size:.85rem;text-align:center}
/* ===== animations ===== */
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1}
@keyframes up{from{opacity:0;transform:translateY(28px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes shift{to{background-position:200% 0}}
@keyframes spin{to{--a:360deg}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 18px var(--acc),0 0 36px var(--acc)}}
@keyframes codein{from{opacity:0;transform:translateX(-14px);clip-path:inset(0 100% 0 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
@keyframes sweep{to{transform:translateX(260%) skewX(-20deg)}}
@keyframes glitch{0%,92%,100%{transform:none;text-shadow:none}93%{transform:translateX(-3px);text-shadow:3px 0 var(--acc2),-3px 0 var(--acc)}96%{transform:translateX(3px);text-shadow:-3px 0 var(--acc2),3px 0 var(--acc)}}
.hero>*{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
.hero>:nth-child(2){animation-delay:.12s}.hero>:nth-child(3){animation-delay:.24s}.hero>:nth-child(4){animation-delay:.36s}
.tag::after{content:"_";margin-left:2px;animation:blink 1s steps(1) infinite}
h1{animation:up .9s .12s both,glitch 6s 2s infinite}
h1 span{background-size:200% 100%;animation:shift 4s linear infinite}
.logo i{display:inline-block;animation:pulse 2.4s ease-in-out infinite}
.cta{position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:rgba(255,255,255,.55);transform:skewX(-20deg);animation:sweep 2.8s 1s infinite}
.cta:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 36px color-mix(in srgb,var(--acc) 45%,transparent)}
.tools button{transition:transform .25s,border-color .25s,box-shadow .25s}
.tools button:hover{transform:translateY(-2px) rotate(-4deg);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 40%,transparent)}
.box{position:relative;border:1px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,conic-gradient(from var(--a),transparent 55%,var(--acc),var(--acc2),transparent) border-box;animation:spin 5s linear infinite;box-shadow:0 20px 70px -20px color-mix(in srgb,var(--acc) 28%,transparent)}
.tab{position:relative;transition:color .2s,transform .2s}
.tab:hover{color:var(--text);transform:translateY(-2px)}
.tab.on{text-shadow:0 0 12px var(--acc)}
.copy{position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.copy:hover{transform:scale(1.07);box-shadow:0 0 22px color-mix(in srgb,var(--acc) 60%,transparent)}
.copy:active{transform:scale(.94)}
.code.anim{animation:codein .6s cubic-bezier(.2,.8,.2,1)}
.feat div{position:relative;transition:transform .3s,border-color .3s;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),var(--panel);animation:up .8s both}
.feat div:nth-child(2){animation-delay:.12s}.feat div:nth-child(3){animation-delay:.24s}
.feat div:hover{transform:translateY(-8px);border-color:var(--acc)}
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));transform-origin:0 50%;transform:scaleX(0);z-index:30;box-shadow:0 0 12px var(--acc)}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;margin:10px 0;padding:8px 18px;border:1px solid transparent;border-radius:999px;transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s}
nav.glass{background:color-mix(in srgb,var(--bg) 65%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
nav.hide{transform:translateY(-150%)}
.hero{min-height:82vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;will-change:transform,opacity}
.box{transform:translateY(calc((1 - var(--p,1))*50px)) scale(calc(.92 + .08*var(--p,1)));will-change:transform}
.feat div{animation:none}
.feat div.rv{transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1),border-color .3s}
.feat div.rv.in:hover{transform:translateY(-8px);transition-duration:.3s}
#top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:1px solid var(--acc);background:var(--panel);color:var(--acc);font-size:1.2rem;cursor:pointer;z-index:30;opacity:0;transform:translateY(24px) scale(.7);pointer-events:none;transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
#top.show{opacity:1;transform:none;pointer-events:auto}
#top:hover{box-shadow:0 0 22px var(--acc);transform:translateY(-4px)}
.stage{height:260vh;position:relative}
.pin{position:sticky;top:0;height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mark{text-align:center;font-weight:900;font-size:clamp(3.4rem,17vw,9.5rem);line-height:.98;letter-spacing:.04em}
.row{display:block}
.ch{display:inline-block;position:relative;filter:drop-shadow(0 0 24px color-mix(in srgb,currentColor 50%,transparent))}
.pc{display:inline-block;will-change:transform,opacity;transform:translate(calc(var(--x)*var(--sp,0)*1px),calc(var(--y)*var(--sp,0)*1px)) rotate(calc(var(--r)*var(--sp,0)*1deg)) scale(calc(1 + var(--sp,0)*.35));opacity:calc(1.7 - var(--sp,0)*1.7)}
.pc.b{position:absolute;left:0;top:0}
.v0 .a{clip-path:polygon(0 0,100% 0,100% 40%,0 70%)}.v0 .b{clip-path:polygon(0 70%,100% 40%,100% 100%,0 100%)}
.v1 .a{clip-path:polygon(0 0,60% 0,30% 100%,0 100%)}.v1 .b{clip-path:polygon(60% 0,100% 0,100% 100%,30% 100%)}
.v2 .a{clip-path:polygon(0 0,100% 0,0 100%)}.v2 .b{clip-path:polygon(100% 0,100% 100%,0 100%)}
.hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));font:600 .8rem "JetBrains Mono",monospace;letter-spacing:.3em;color:var(--mute);opacity:calc(1 - var(--sp,0)*5);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.adm{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:500 .85rem inherit;font-family:inherit;cursor:pointer;transition:border-color .2s,color .2s,transform .2s;display:inline-block}
.ghost:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-2px)}
.ghost.danger:hover{border-color:#ff5d6c;color:#ff5d6c}
.mdl{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mdl.on{display:flex}
.mdl .card{width:min(640px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--acc);border-radius:16px;padding:22px;display:grid;gap:10px;box-shadow:0 0 60px color-mix(in srgb,var(--acc) 25%,transparent);animation:up .35s both}
.mdl h3{margin:0 0 4px}
.mdl input:not([type=file]),.mdl textarea{width:100%;background:var(--code);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:400 .9rem "JetBrains Mono",ui-monospace,monospace;outline:none;transition:border-color .2s}
.mdl input:focus,.mdl textarea:focus{border-color:var(--acc)}
.mdl textarea{min-height:200px;resize:vertical;white-space:pre}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
#ms{color:var(--mute);font-size:.85rem}
/* ===== v2 compact layout ===== */
.markfix{position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;padding-bottom:16vh;pointer-events:none}
.pc{transform:translate(calc(var(--x)*var(--sp,0)*1px),calc(var(--y)*var(--sp,0)*1px + var(--f,0)*var(--sy,0)*.1px + var(--f,0)*var(--v,0)*1px)) rotate(calc(var(--r)*var(--sp,0)*1deg + var(--f,0)*var(--v,0)*.25deg)) scale(calc(1 + var(--sp,0)*.25));opacity:calc(1 - var(--sp,0)*.86)}
.hero{position:relative;min-height:calc(100svh - 84px);justify-content:flex-end;align-items:center;text-align:center;padding:0 0 11vh}
.hero h1{font-size:clamp(1.25rem,3.4vw,1.9rem);margin:.2em 0;animation:up .9s .12s both}
.hero .sub{margin:0 auto;font-size:.98rem}
.hero .cta{margin-top:18px}
#scripts{padding-top:4vh}
.box{margin:16px 0 36px}
.code{max-height:360px}
.feat{margin:16px 0 36px}
.feat div{padding:16px}
footer{padding:18px 0}
/* ===== v3 script library ===== */
.wrap{max-width:1080px}
.lib{display:grid;grid-template-columns:minmax(230px,310px) 1fr;height:min(580px,74vh);height:min(580px,74svh);min-height:420px}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.srch{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.srch input{width:100%;background:var(--code);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:400 .9rem inherit;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
.srch input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.cnt{font:600 .72rem "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.list{position:relative;flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--acc) transparent}
.item{position:relative;display:grid;grid-template-columns:auto 1fr;column-gap:10px;text-align:left;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;font-family:inherit;animation:up .5s backwards;transition:border-color .2s,background .2s,transform .2s;flex:none}
.item i{grid-row:1/4;align-self:start;font:600 .75rem "JetBrains Mono",monospace;color:var(--mute);font-style:normal;padding-top:2px}
.item b{font:600 .88rem "JetBrains Mono",monospace;overflow-wrap:anywhere}
.item small{color:var(--acc);font-size:.72rem;font-family:"JetBrains Mono",monospace}
.item span{color:var(--mute);font-size:.82rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item:hover{border-color:var(--acc);transform:translateX(3px)}
.item:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.item.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 9%,transparent);box-shadow:inset 3px 0 0 var(--acc)}
.item.on i{color:var(--acc)}
.none{color:var(--mute);text-align:center;margin:24px 0}
.view{display:flex;flex-direction:column;min-width:0;min-height:0}
.meta p{flex:1;min-width:150px}
.codewrap{flex:1;min-height:0;overflow:auto;display:flex;background:var(--code);border-top:1px solid var(--line)}
.gut,.codewrap .code{margin:0;font:400 .85rem/1.7 "JetBrains Mono",ui-monospace,Consolas,monospace}
.gut{position:sticky;left:0;padding:18px 12px 18px 14px;text-align:right;color:var(--mute);opacity:.75;user-select:none;-webkit-user-select:none;background:var(--code);border-right:1px solid var(--line)}
.codewrap .code{flex:1;min-width:max-content;max-height:none;overflow:visible;border:0;background:transparent;padding:18px 18px 18px 14px}
@media (max-width:720px){
.lib{grid-template-columns:1fr;height:auto}
.side{border-right:0;border-bottom:1px solid var(--line)}
.list{flex:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory}
.item{flex:0 0 76%;scroll-snap-align:start}
.view{height:440px}
}
#scripts{scroll-margin-top:76px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="bar"></div><canvas id="bg"></canvas><button id="top" aria-label="Top">↑</button>
<div class="markfix"><div class="mark" id="mark" aria-label="Studio Shin"></div></div>
<div class="wrap">
<nav><div class="logo">STUDIO <i>SHIN</i></div>
<div class="tools"><button id="lgn"></button><button id="lang">EN</button><button id="theme">◐</button></div></nav>

<section class="hero">
<div class="tag">// SCRIPT LIBRARY</div>
<h1 data-k="h1"></h1>
<p class="sub" data-k="sub"></p>
<a class="cta" href="#scripts" data-k="cta"></a>
<div class="hint">SCROLL ↓</div>
</section>

<section id="scripts">
<h2 data-k="h2"></h2>
<div class="box">
<div class="lib">
<aside class="side"><div class="srch"><input id="q" type="search" autocomplete="off"><div class="cnt" id="cnt"></div></div><div class="list" id="tabs"></div></aside>
<div class="view"><div class="meta"><p id="desc"></p><button class="ghost" id="dwn"></button><button class="copy" id="copy"></button></div>
<div class="codewrap"><pre class="gut" id="gut" aria-hidden="true"></pre><pre class="code" id="code"></pre></div></div>
</div>
</div>
</section>

<section class="feat" id="feat"></section>
<footer>© 2026 Studio Shin · <span data-k="foot"></span> · <a id="lgl" href="#" aria-label="admin" style="color:inherit;opacity:.45;text-decoration:none">🔒</a></footer>
</div>

<script>
var PRISTINE="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
/* ====== 在这里放你的脚本 / PUT YOUR SCRIPTS HERE ======
   每个脚本: name 文件名, zh/en 说明, code 内容 (用反引号 ` ` 包起来) */
var SCRIPTS=/*DATA_START*/[
{name:"example.lua",zh:"示例脚本：把你自己的代码粘贴到这里。",en:"Example script: paste your own code here.",
code:`-- 示例 / Example
local function greet(name)
  print("你好, " .. name .. "!")
end

greet("Studio Shin")`},
{name:"example.py",zh:"第二个示例：可以添加任意多个脚本。",en:"Second example: add as many scripts as you like.",
code:`# 示例 / Example
def greet(name):
    print(f"你好, {name}!")

greet("Studio Shin")`}
]/*DATA_END*/;

var T={
zh:{h1:'<span>脚本</span>展示，<br>一键复制，直接使用。',sub:'向下滚动，挑选你需要的脚本，一键复制或下载。',cta:'查看脚本',h2:'脚本列表',copy:'复制代码',q:'搜索脚本…',cnt:'个脚本',none:'没有找到',ln:'行',dwn:'下载',done:'已复制 ✓',foot:'保留所有权利。',
f:[['01','一键复制','点击按钮即可复制完整代码。'],['02','随时查看','无需登录，打开网页就能看。'],['03','中英双语','支持中文与英文界面切换。']]},
en:{h1:'<span>Scripts</span> on display,<br>copy and use instantly.',sub:'Scroll down, pick a script, then copy or download it in one click.',cta:'View scripts',h2:'Script library',copy:'Copy code',q:'Search scripts…',cnt:'scripts',none:'No matches',ln:'lines',dwn:'Download',done:'Copied ✓',foot:'All rights reserved.',
f:[['01','One-click copy','Copy the full code with a single click.'],['02','Open to everyone','No login needed — just open and read.'],['03','Bilingual','Switch between Chinese and English.']]}
};
var lang="zh",cur=0,$=function(i){return document.getElementById(i)};
try{lang=localStorage.getItem("lang")||(/^zh/i.test(navigator.language)?"zh":"en")}catch(e){}

var qs="",userSel=false;
var LN={lua:"Lua",py:"Python",js:"JavaScript",ts:"TypeScript",sh:"Shell",bat:"Batch",ps1:"PowerShell",json:"JSON",html:"HTML",css:"CSS",c:"C",cpp:"C++",cs:"C#",java:"Java",go:"Go",rs:"Rust",php:"PHP",rb:"Ruby",ahk:"AutoHotkey",txt:"Text",md:"Markdown",cfg:"Config",ini:"Config"};
function ext(n){var m=/\.([a-z0-9]+)$/i.exec(n||"");return m?m[1].toLowerCase():""}
function nl(c){return String(c||"").replace(/\n$/,"").split("\n").length}
function kb(n){return n<1024?n+" B":(n/1024).toFixed(1)+" KB"}
function drawList(){
  var l=$("tabs"),t=T[lang],q=qs.trim().toLowerCase(),n=0;
  l.innerHTML="";
  SCRIPTS.forEach(function(s,i){
    if(q&&(s.name+" "+s.zh+" "+s.en).toLowerCase().indexOf(q)<0)return;
    n++;
    var b=document.createElement("button");b.type="button";b.className="item"+(i===cur?" on":"");b.dataset.i=i;
    b.style.animationDelay=Math.min(n,12)*45+"ms";
    var no=document.createElement("i");no.textContent=String(i+1).padStart(2,"0");
