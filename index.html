<style>
:root{--bg:#07080b;--panel:#0e1117;--line:#1c2230;--text:#e8ecf4;--mute:#8791a5;--acc:#3dffb0;--acc2:#18b6ff;--code:#0a0d13;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f7fa;--panel:#fff;--line:#dde3ec;--text:#10151f;--mute:#5a667b;--acc:#00a56a;--acc2:#0a7fc4;--code:#f0f3f8}}
:root[data-theme="light"]{--bg:#f5f7fa;--panel:#fff;--line:#dde3ec;--text:#10151f;--mute:#5a667b;--acc:#00a56a;--acc2:#0a7fc4;--code:#f0f3f8}
:root[data-theme="dark"]{--bg:#07080b;--panel:#0e1117;--line:#1c2230;--text:#e8ecf4;--mute:#8791a5;--acc:#3dffb0;--acc2:#18b6ff;--code:#0a0d13}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;
background-image:radial-gradient(60rem 30rem at 80% -10%,color-mix(in srgb,var(--acc) 14%,transparent),transparent),radial-gradient(40rem 25rem at -10% 20%,color-mix(in srgb,var(--acc2) 12%,transparent),transparent)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{font-weight:900;letter-spacing:.12em;font-size:1.15rem}
.logo i{color:var(--acc);font-style:normal}
.tools{display:flex;gap:8px}
.tools button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:500 .85rem inherit;font-family:inherit;cursor:pointer}
.tools button:hover{border-color:var(--acc)}
.hero{padding:70px 0 50px}
.tag{font-family:"JetBrains Mono",monospace;color:var(--acc);font-size:.8rem;letter-spacing:.15em}
h1{font-size:clamp(2.2rem,7vw,4.2rem);line-height:1.1;margin:.4em 0;font-weight:900}
h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);max-width:560px;font-size:1.05rem}
.cta{display:inline-block;margin-top:24px;padding:12px 26px;border-radius:10px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#04110c;font-weight:700;text-decoration:none}
h2{font-size:1.6rem;margin:0 0 6px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:20px 0 70px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:8px 8px 0}
.tab{background:none;border:0;color:var(--mute);padding:10px 16px;font:600 .85rem "JetBrains Mono",monospace;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--acc);border-color:var(--acc)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap}
.meta p{margin:0;color:var(--mute);font-size:.92rem}

/* ===== animations ===== */

.hero{min-height:82vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;will-change:transform,opacity}

(function(){
  var chs=[].slice.call(document.querySelectorAll("#mark .ch")),cen=[],mx=-9999,my=-9999,act=false;
  function measure(){cen=chs.map(function(c){var r=c.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,el:c,vx:0,vy:0}})}
  measure();addEventListener("resize",measure);setTimeout(measure,600);setTimeout(measure,2000);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);
  addEventListener("pointermove",function(e){mx=e.clientX;my=e.clientY;act=true});
  document.addEventListener("pointerleave",function(){mx=-9999;my=-9999});
  (function loop(){
    if(act){var any=false;
      cen.forEach(function(c){var dx=c.x-mx,dy=c.y-my,d=Math.sqrt(dx*dx+dy*dy)||1,k=Math.max(0,1-d/240),f=k*k*95*(1-SPV);
        c.vx+=(dx/d*f-c.vx)*.14;c.vy+=(dy/d*f-c.vy)*.14;
        if(Math.abs(c.vx)>.05||Math.abs(c.vy)>.05)any=true;
        c.el.style.setProperty("--rx",c.vx.toFixed(1));c.el.style.setProperty("--ry",c.vy.toFixed(1))});
      if(!any&&mx<-999)act=false}
    if(ASMR){var ph=(performance.now()-ASMT)/1400;if(ph>=1){ASM=0;ASMR=false}else ASM=Math.sin(Math.PI*ph);setEp()}
    requestAnimationFrame(loop)})();

  function fmtT(t){return t?new Date(t).toLocaleString(lang==="zh"?"zh-CN":"en-US",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"\u2014"}
  function lines2(c){return String(c).replace(/\n$/,"").split("\n")}
  function diffLines(a,b){
    var A=lines2(a),B=lines2(b),p=0;
    while(p<A.length&&p<B.length&&A[p]===B[p])p++;
    var ea=A.length,eb=B.length;
    while(ea>p&&eb>p&&A[ea-1]===B[eb-1]){ea--;eb--}
    var a2=A.slice(p,ea),b2=B.slice(p,eb),n=a2.length,m=b2.length;
    if(n*m>2500000)return null;
    var dp=[],i,j;for(i=0;i<=n;i++)dp.push(new Uint16Array(m+1));
    for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)dp[i][j]=a2[i]===b2[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    var out=[];for(i=0;i<p;i++)out.push([" ",A[i]]);
    i=0;j=0;
    while(i<n&&j<m){if(a2[i]===b2[j]){out.push([" ",a2[i]]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){out.push(["-",a2[i]]);i++}else{out.push(["+",b2[j]]);j++}}
    while(i<n)out.push(["-",a2[i++]]);while(j<m)out.push(["+",b2[j++]]);
    for(i=ea;i<A.length;i++)out.push([" ",A[i]]);
    return out}
  function drawDiff(a,b,e){var d=$("hdiff"),out;
    if(a===null)out=lines2(b).map(function(x){return[" ",x]});else out=diffLines(a,b);
    if(out===null){d.textContent=T[lang].nodiff;return}
    if(a!==null&&!out.some(function(x){return x[0]!==" "})){d.textContent=T[lang].same;return}
    var keep=out.map(function(){return a===null});
    if(a!==null){out.forEach(function(x,i){if(x[0]!==" ")for(var j=Math.max(0,i-3);j<=Math.min(out.length-1,i+3);j++)keep[j]=true})}
    var html="",skip=0;
    out.forEach(function(x,i){if(!keep[i]){skip++;return}
      if(skip){html+='<span class="dl sk">\u22ef '+skip+'</span>';skip=0}
      html+='<span class="dl '+(x[0]==="+"?"add":x[0]==="-"?"del":"ctx")+'" data-s="'+(x[0]===" "?"":x[0])+'">'+(hl(x[1],e)||" ")+'</span>'});
    if(skip)html+='<span class="dl sk">\u22ef '+skip+'</span>';
    d.innerHTML=html}
  function openHist(){
    var s=SCRIPTS[cur];if(!s)return;
    var t=T[lang],V=[{t:s.t,code:s.code}].concat(s.hist||[]),sel=0,e=ext(s.name);
    $("httl").textContent=t.ht+" \u00b7 "+s.name;
    function show(){
      var l=$("hlist");l.innerHTML="";
      V.forEach(function(v,k){var b=document.createElement("button");b.type="button";b.className="item"+(k===sel?" on":"");
        var h=document.createElement("b");h.textContent="v"+(V.length-k)+(k===0?" \u00b7 "+t.curv:"");
        var sm=document.createElement("small");sm.textContent=fmtT(v.t);b.appendChild(h);b.appendChild(sm);
        b.onclick=function(){sel=k;show()};l.appendChild(b)});
      var hb=$("hbar");hb.innerHTML="";
      var cp=document.createElement("button");cp.className="ghost";cp.textContent=t.cpv;cp.onclick=function(){copyText(V[sel].code)};hb.appendChild(cp);
      if(window.restoreVersion&&sel>0){var rs=document.createElement("button");rs.className="ghost";rs.textContent=t.rest;
        rs.onclick=function(){window.restoreVersion(V[sel].code);$("hmod").classList.remove("on")};hb.appendChild(rs)}
      drawDiff(sel<V.length-1?V[sel+1].code:null,V[sel].code,e)}
    show();$("hmod").classList.add("on")}
  $("hbtn").onclick=openHist;
  $("hclose").onclick=function(){$("hmod").classList.remove("on")};
  $("hmod").onclick=function(e){if(e.target===$("hmod"))$("hmod").classList.remove("on")};
  $("lnk").onclick=function(){var s=SCRIPTS[cur];if(!s)return;var b=$("lnk");
    copyText(location.href.split("#")[0]+"#s="+encodeURIComponent(s.name));
    b.textContent="\u2713 "+T[lang].lnkok;setTimeout(function(){b.textContent="\uD83D\uDD17 "+T[lang].lnk},1600)};
  $("code").addEventListener("click",function(){if(TY){typeStop();var s=SCRIPTS[cur];$("code").innerHTML=hl(s.code,ext(s.name))}});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")document.querySelectorAll(".mdl.on").forEach(function(m){m.classList.remove("on")})});
  addEventListener("hashchange",function(){applyHash(false)});
  fetch("/api/site").then(function(r){return r.ok?r.json():null}).then(function(j){if(j&&Array.isArray(j.links)){SITE=j;drawLinks()}}).catch(function(){});
  render();applyHash(true);
})();
</script>
</body>
</html>
